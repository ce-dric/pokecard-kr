name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Custom domain: set SITE_URL to https://example.com and BASE_PATH to /
  SITE_URL: https://ce-dric.github.io
  BASE_PATH: /pokecard-kr
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Restore reaction cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: .community-cache/reactions.json
          key: community-reactions-${{ github.run_id }}
          restore-keys: |
            community-reactions-
      - name: Use cached reactions
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p src/data/community .community-cache
          if [ -f .community-cache/reactions.json ]; then
            cp .community-cache/reactions.json src/data/community/reactions.json
          fi
      - name: Collect community reactions
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_MAX_CALLS: "480"
        run: node scripts/fetch-reactions.mjs
      - name: Update reaction cache
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p .community-cache
          cp src/data/community/reactions.json .community-cache/reactions.json
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
