name: Community reactions

on:
  schedule:
    # Every 6 hours. The site is rebuilt each run; the git snapshot is committed at most daily.
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://ce-dric.github.io
  BASE_PATH: /pokecard-kr
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .community-cache/reactions.json
          key: community-reactions-${{ github.run_id }}
          restore-keys: |
            community-reactions-
      - name: Restore cached snapshot
        run: |
          mkdir -p src/data/community .community-cache
          if [ -f .community-cache/reactions.json ]; then
            cp .community-cache/reactions.json src/data/community/reactions.json
          fi
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Collect community reactions
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_MAX_CALLS: "480"
        run: node scripts/fetch-reactions.mjs
      - name: Update reaction cache
        run: |
          mkdir -p .community-cache
          cp src/data/community/reactions.json .community-cache/reactions.json
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Commit the daily snapshot
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          file=src/data/community/reactions.json
          if git diff --quiet -- "$file"; then
            echo "Snapshot is unchanged."
            exit 0
          fi
          new_at=$(node --input-type=module -e "import {readFileSync} from 'node:fs'; const data = JSON.parse(readFileSync('$file','utf8')); process.stdout.write(data.updatedAt || '')")
          if [ -z "$new_at" ]; then
            echo "No successful collection timestamp. Skip commit."
            exit 0
          fi
          old_at=$(git show "HEAD:$file" | node --input-type=module -e "let raw=''; process.stdin.on('data', (chunk) => { raw += chunk; }); process.stdin.on('end', () => { const data = JSON.parse(raw); process.stdout.write(data.updatedAt || ''); });")
          last=$(git log -1 --format=%ct -- "$file" || true)
          last=${last:-0}
          now=$(date +%s)
          age=$((now - last))
          if [ -n "$old_at" ] && [ "$age" -lt 86400 ]; then
            echo "Last snapshot commit is ${age}s old. Deploy this build without another commit."
            exit 0
          fi
          git add "$file"
          git commit -m "Update the community reaction snapshot" -m "Keep the checked-in fallback current. The site rebuilds every six hours, and this commit is limited to once a day."
          git push origin HEAD

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
