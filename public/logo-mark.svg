<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="포카북">
  <title>포카북</title>
  <style>
    .stick-l,
    .stick-r,
    .body,
    .buk,
    .pad,
    .dung-l,
    .dung-r,
    .spark {
      transform-box: view-box;
    }
    .stick-l {
      transform-origin: 32px 70px;
      animation: drum-l 1s infinite;
    }
    .stick-r {
      transform-origin: 96px 68px;
      animation: drum-r 1s infinite;
    }
    .body {
      transform-origin: 66px 64px;
      animation: body-bounce 1s infinite;
    }
    .buk {
      transform-origin: 54px 104px;
      animation: squash-l 1s infinite;
    }
    .pad {
      transform-origin: 74px 104px;
      animation: squash-r 1s infinite;
    }
    .dung-l {
      transform-origin: 50px 82px;
      opacity: 0;
      animation: dung-l 1s infinite;
    }
    .dung-r {
      transform-origin: 80px 80px;
      opacity: 0;
      animation: dung-r 1s infinite;
    }
    .spark {
      transform-origin: center;
      animation: twinkle 1s ease-in-out infinite;
    }
    .spark-a { transform-origin: 111px 38px; }
    .spark-b { transform-origin: 22px 44px; animation-delay: -0.5s; }

    @keyframes drum-l {
      0%, 48%, 100% { transform: rotate(0deg); }
      8% { transform: rotate(-10deg); }
      16% { transform: rotate(20deg); }
      28% { transform: rotate(-12deg); }
      40% { transform: rotate(0deg); }
    }
    @keyframes drum-r {
      0%, 48%, 100% { transform: rotate(0deg); }
      58% { transform: rotate(10deg); }
      66% { transform: rotate(-20deg); }
      78% { transform: rotate(12deg); }
      90% { transform: rotate(0deg); }
    }
    @keyframes body-bounce {
      0%, 14%, 30%, 64%, 80%, 100% { transform: translateY(0); }
      16% { transform: translateY(2.2px); }
      22% { transform: translateY(-1px); }
      66% { transform: translateY(2.2px); }
      72% { transform: translateY(-1px); }
    }
    @keyframes squash-l {
      0%, 14%, 28%, 100% { transform: scale(1); }
      16% { transform: scale(1.07, 0.86); }
      22% { transform: scale(0.98, 1.04); }
    }
    @keyframes squash-r {
      0%, 64%, 78%, 100% { transform: scale(1); }
      66% { transform: scale(1.07, 0.86); }
      72% { transform: scale(0.98, 1.04); }
    }
    @keyframes dung-l {
      0%, 15%, 30%, 100% { opacity: 0; transform: scale(0.6); }
      17% { opacity: 1; transform: scale(1); }
      24% { opacity: 0.85; transform: scale(1.15); }
    }
    @keyframes dung-r {
      0%, 65%, 80%, 100% { opacity: 0; transform: scale(0.6); }
      67% { opacity: 1; transform: scale(1); }
      74% { opacity: 0.85; transform: scale(1.15); }
    }
    @keyframes twinkle {
      0%, 100% { transform: scale(1); opacity: 1; }
      16%, 66% { transform: scale(1.18); opacity: 1; }
      40% { transform: scale(0.92); opacity: 0.85; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stick-l,
      .stick-r,
      .body,
      .buk,
      .pad,
      .dung-l,
      .dung-r,
      .spark,
      .spark-a,
      .spark-b {
        animation: none !important;
      }
      .dung-l,
      .dung-r {
        opacity: 0 !important;
      }
    }
  </style>

  <path class="spark spark-a" fill="#E2B33A" d="M108 28l3.2 7.2 7.2 3.2-7.2 3.2-3.2 7.2-3.2-7.2-7.2-3.2 7.2-3.2z"/>
  <path class="spark spark-b" fill="#E2B33A" d="M20 36l2 4.6 4.6 2-4.6 2-2 4.6-2-4.6-4.6-2 4.6-2z"/>

  <g transform="rotate(14 104 92)">
    <rect x="92" y="74" width="24" height="34" rx="3.5" fill="#E8C15A" stroke="#C9962E" stroke-width="1.6"/>
    <path fill="#F6E7A8" d="M104 84l1.6 3.4 3.4 1.6-3.4 1.6-1.6 3.4-1.6-3.4-3.4-1.6 3.4-1.6z"/>
    <path fill="#F6E7A8" d="M110 96l1.1 2.3 2.3 1.1-2.3 1.1-1.1 2.3-1.1-2.3-2.3-1.1 2.3-1.1z"/>
  </g>

  <g class="body">
    <path d="M28 22c0-5.2 4-9.4 9-9.4h10v103.2H37c-5 0-9-4.2-9-9.4V22z" fill="#1E3A6E"/>
    <path d="M37 12.6h58.5c5 0 9 4.2 9 9.4v84.4c0 5.2-4 9.4-9 9.4H37V12.6z" fill="#F6EBD3"/>
    <path d="M37 12.6h58.5c5 0 9 4.2 9 9.4H37V12.6z" fill="#E8D7B0"/>
    <circle cx="58" cy="41.5" r="4.2" fill="#1C1C1C"/>
    <circle cx="78" cy="41.5" r="4.2" fill="#1C1C1C"/>
    <circle cx="59.3" cy="40.2" r="1.15" fill="#FFF"/>
    <circle cx="79.3" cy="40.2" r="1.15" fill="#FFF"/>
    <ellipse cx="51.5" cy="49.5" rx="5.2" ry="3.2" fill="#F3B4AE"/>
    <ellipse cx="84.5" cy="49.5" rx="5.2" ry="3.2" fill="#F3B4AE"/>
    <path fill="#1C1C1C" d="M59 49c.6 1.2 3.4 7.2 9 7.2s8.4-6 9-7.2c-2.2 3.2-5.4 4.8-9 4.8s-6.8-1.6-9-4.8z"/>
  </g>

  <g class="buk">
    <ellipse cx="54" cy="98" rx="22" ry="16.5" fill="#B56E2E"/>
    <ellipse cx="54" cy="98" rx="18" ry="13" fill="#C9843A"/>
    <path stroke="#9A5A24" stroke-width="1.3" fill="none" d="M42 88.5c3.5 6 5 13 5 19.5"/>
    <path stroke="#9A5A24" stroke-width="1.3" fill="none" d="M50 86.8c2.2 7 3.2 14 3.2 22.4"/>
    <path stroke="#9A5A24" stroke-width="1.3" fill="none" d="M58 86.8c0 7.5.4 15 .6 22.4"/>
  </g>

  <g class="pad">
    <circle cx="74" cy="98" r="18.2" fill="#1E3A6E"/>
    <circle cx="74" cy="98" r="14.4" fill="#F6EBD3"/>
    <circle cx="74" cy="98" r="11.6" fill="none" stroke="#E8D7B0" stroke-width="1.2"/>
  </g>

  <g class="dung-l" fill="none" stroke="#C9962E" stroke-width="1.8" stroke-linecap="round">
    <path d="M42 80l-7-8"/>
    <path d="M48 76l-1-9"/>
    <path d="M54 77l5-8"/>
  </g>
  <g class="dung-r" fill="none" stroke="#C9962E" stroke-width="1.8" stroke-linecap="round">
    <path d="M74 76l-4-9"/>
    <path d="M80 74l2-9"/>
    <path d="M86 78l7-7"/>
  </g>

  <g class="stick-l">
    <path d="M30 72c-8 4-14 14-13 22 6-2 14-2 20-7 2-8-1-14-7-15z" fill="#1E3A6E"/>
    <line x1="24" y1="86" x2="58" y2="72" stroke="#C9A05A" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="24" cy="88" r="6.2" fill="#1E3A6E"/>
  </g>

  <g class="stick-r">
    <path d="M96 70c8 3 15 12 15 20-6 0-14-1-21-7-1-8 1-13 6-13z" fill="#1E3A6E"/>
    <line x1="104" y1="84" x2="80" y2="70" stroke="#C9A05A" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="104" cy="86" r="6.2" fill="#1E3A6E"/>
  </g>
</svg>
